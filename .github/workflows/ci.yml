name: Build Check

# Runs on every push and every pull request, against the exact same install
# command Cloudflare Pages uses (bun install --frozen-lockfile). If a new
# file, a new dependency, or a package.json/bun.lock mismatch would break the
# Cloudflare build, this fails LOUDLY here first — before it ever reaches
# production — instead of silently breaking the live deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Install, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (same as Cloudflare — frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Build (client + server bundle)
        run: bun run build
