name = "nexorum-web3-app"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
NEXORUM_KERNEL_VERSION = "1.0.0"

[[d1_databases]]
binding = "DB"
database_name = "nexorum_web3_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "NEXORUM_KV"
id = "00000000000000000000000000000000"

[[routes]]
pattern = "web3.nexorum.os/*"
zone_name = "nexorum.os"
