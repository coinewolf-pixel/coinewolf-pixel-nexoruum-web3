name = "web3"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# The live site is served from the workers.dev subdomain
# (web3.coinewolf.workers.dev), so keep that explicitly enabled. Newer
# wrangler defaults workers_dev to false once any other config is present,
# which silently disabled the working URL on a recent deploy.
workers_dev = true

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
NEXORUM_KERNEL_VERSION = "1.0.0"

# D1 database and KV namespace bindings were previously configured here with
# placeholder IDs ("00000000...") that don't correspond to real resources in
# the Cloudflare account, which made every deploy fail with
# "KV namespace '00000...' not found". Neither binding is currently
# referenced anywhere in worker.ts (db.* is still in-memory — see the
# module docblock at the top of worker.ts), so they've been removed rather
# than pointed at fake IDs. To add real persistence later:
#   wrangler d1 create nexorum_web3_db
#   wrangler kv namespace create NEXORUM_KV
# then re-add [[d1_databases]] / [[kv_namespaces]] here with the real IDs
# those commands print out.

# A custom domain route (web3.nexorum.os under zone nexorum.os) was
# previously configured here, but that zone does not exist in this
# Cloudflare account ("The zone nexorum.os does not exist on your
# account" [code: 10083]), which made every deploy fail at the final
# trigger-configuration step even though the Worker itself uploaded fine.
# Removed until/unless nexorum.os is actually added as a zone in this
# account — see https://developers.cloudflare.com/workers/configuration/routing/routes/
# for how to re-add it once that's done.
